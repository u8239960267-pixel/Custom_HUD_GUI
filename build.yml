name: Build Custom HUD GUI

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    name: Build Minecraft ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: "1.21.4"
            folder: "mc1.21.4"
          - minecraft: "1.21.11"
            folder: "mc1.21.11"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build mod JAR
        working-directory: ${{ matrix.folder }}
        run: gradle build --no-daemon
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: custom-hud-gui-minecraft-${{ matrix.minecraft }}
          path: |
            ${{ matrix.folder }}/build/libs/*.jar
            !${{ matrix.folder }}/build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14
